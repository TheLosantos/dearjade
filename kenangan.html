<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4e9ed">
    <title>Memories for You ♡</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        color: #503746;
        background: #f4e9ed;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse at 50% 82%, rgba(187, 115, 139, 0.15), transparent 56%),
          radial-gradient(ellipse at 50% 34%, rgba(255, 255, 255, 0.78), transparent 54%),
          #fff;
      }

      .page {
        position: relative;
        isolation: isolate;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 22px 20px 28px;
        text-align: center;
      }

      .background-decor,
      .balloon-field {
        position: absolute;
        z-index: -1;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .background-decor::before,
      .background-decor::after {
        position: absolute;
        inset: 0;
        content: "";
      }

      .background-decor::before {
        background:
          radial-gradient(ellipse at 10% 20%, rgba(255, 222, 167, 0.42), transparent 34%),
          radial-gradient(ellipse at 91% 27%, rgba(238, 174, 191, 0.3), transparent 33%),
          radial-gradient(ellipse at 82% 88%, rgba(255, 222, 167, 0.32), transparent 31%),
          radial-gradient(ellipse at 14% 83%, rgba(229, 185, 208, 0.24), transparent 34%);
      }

      .background-decor::after {
        background:
          radial-gradient(circle, rgba(195, 132, 77, 0.3) 1.4px, transparent 2px) 8% 24% / 143px 143px,
          radial-gradient(circle, rgba(197, 95, 117, 0.23) 1.2px, transparent 2px) 91% 20% / 157px 157px,
          radial-gradient(circle, rgba(195, 132, 77, 0.25) 1.3px, transparent 2px) 86% 83% / 151px 151px,
          radial-gradient(circle, rgba(197, 95, 117, 0.2) 1.2px, transparent 2px) 13% 78% / 169px 169px;
      }

      .background-sparkle {
        position: absolute;
        color: #c99439;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1;
        opacity: 0.7;
        text-shadow: 0 2px 6px rgba(180, 124, 54, 0.18);
        animation: sparkle-float 3.6s ease-in-out infinite;
      }

      .background-sparkle-one {
        top: 13%;
        left: 17%;
        font-size: 1.45rem;
      }

      .background-sparkle-two {
        top: 23%;
        right: 15%;
        color: #c45b70;
        font-size: 1.15rem;
        animation-delay: 600ms;
      }

      .background-sparkle-three {
        top: 48%;
        left: 8%;
        font-size: 1.1rem;
        animation-delay: 1.2s;
      }

      .background-sparkle-four {
        top: 55%;
        right: 9%;
        color: #c45b70;
        font-size: 1.55rem;
        animation-delay: 350ms;
      }

      .background-sparkle-five {
        bottom: 17%;
        left: 22%;
        color: #c45b70;
        font-size: 1.05rem;
        animation-delay: 900ms;
      }

      .background-sparkle-six {
        right: 24%;
        bottom: 13%;
        font-size: 1.35rem;
        animation-delay: 1.5s;
      }

      .balloon {
        position: absolute;
        bottom: -110px;
        left: var(--balloon-left);
        width: var(--balloon-width, 42px);
        height: calc(var(--balloon-width, 42px) * 1.22);
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 50% 50% 46% 46%;
        background: radial-gradient(ellipse at 32% 25%, #fff4d4 0%, var(--balloon-light) 13%, var(--balloon-color) 58%, var(--balloon-dark) 100%);
        box-shadow: inset -5px -5px 9px rgba(95, 42, 48, 0.12), 0 4px 10px rgba(108, 67, 69, 0.12);
        opacity: 0;
        animation: balloon-rise var(--balloon-duration, 21s) var(--balloon-delay, 0s) linear infinite;
      }

      .balloon::before {
        position: absolute;
        bottom: -6px;
        left: calc(50% - 4px);
        width: 8px;
        height: 8px;
        background: var(--balloon-dark);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        content: "";
      }

      .balloon::after {
        position: absolute;
        top: calc(100% + 2px);
        left: 50%;
        width: 1px;
        height: 78px;
        background: rgba(111, 89, 91, 0.45);
        content: "";
        transform: rotate(3deg);
        transform-origin: top;
      }

      .balloon-one {
        --balloon-left: 8%;
        --balloon-width: 38px;
        --balloon-light: #ffe0a1;
        --balloon-color: #f2bd54;
        --balloon-dark: #ce8b2a;
        --balloon-duration: 22s;
        --balloon-delay: -8s;
      }

      .balloon-two {
        --balloon-left: 25%;
        --balloon-width: 30px;
        --balloon-light: #ffd9e1;
        --balloon-color: #ec91a8;
        --balloon-dark: #c85d78;
        --balloon-duration: 19s;
        --balloon-delay: -15s;
      }

      .balloon-three {
        --balloon-left: 43%;
        --balloon-width: 34px;
        --balloon-light: #fff0b8;
        --balloon-color: #e7c85d;
        --balloon-dark: #c09b37;
        --balloon-duration: 24s;
        --balloon-delay: -4s;
      }

      .balloon-four {
        --balloon-left: 63%;
        --balloon-width: 31px;
        --balloon-light: #f9d4dd;
        --balloon-color: #df849d;
        --balloon-dark: #b84c69;
        --balloon-duration: 20s;
        --balloon-delay: -12s;
      }

      .balloon-five {
        --balloon-left: 83%;
        --balloon-width: 40px;
        --balloon-light: #ffe8bb;
        --balloon-color: #eab270;
        --balloon-dark: #c57e48;
        --balloon-duration: 23s;
        --balloon-delay: -18s;
      }

      @keyframes balloon-rise {
        0% {
          opacity: 0;
          transform: translate3d(0, 0, 0) rotate(-5deg);
        }

        8% {
          opacity: 0.82;
        }

        50% {
          transform: translate3d(14px, -62vh, 0) rotate(5deg);
        }

        92% {
          opacity: 0.78;
        }

        100% {
          opacity: 0;
          transform: translate3d(-8px, -125vh, 0) rotate(-4deg);
        }
      }

      @keyframes sparkle-float {
        0%,
        100% {
          opacity: 0.55;
          transform: translateY(0) rotate(-8deg) scale(0.9);
        }

        50% {
          opacity: 1;
          transform: translateY(-7px) rotate(10deg) scale(1.12);
        }
      }

      .envelope-scene {
        position: relative;
        width: min(500px, 88vw);
        height: clamp(410px, 83vw, 590px);
        perspective: 1100px;
      }

      .envelope {
        position: absolute;
        right: 0;
        bottom: 16px;
        left: 0;
        height: 77%;
        border: 1px solid rgba(119, 14, 48, 0.45);
        border-radius: 7px 7px 5px 5px;
        background: linear-gradient(145deg, #d51e4d 0%, #bd123f 42%, #990a34 100%);
        box-shadow:
          inset 1px 1px 0 rgba(255, 229, 233, 0.48),
          inset -5px -7px 12px rgba(75, 2, 25, 0.22),
          0 2px 2px rgba(255, 230, 234, 0.45),
          0 17px 24px rgba(67, 28, 43, 0.22),
          0 34px 35px rgba(67, 28, 43, 0.12);
        transform: rotateX(3deg) rotateY(-1deg);
        transform-style: preserve-3d;
      }

      .envelope::after {
        position: absolute;
        z-index: -1;
        inset: 3px 2px -8px;
        border: 1px solid rgba(95, 5, 32, 0.5);
        border-radius: 6px;
        background: linear-gradient(160deg, #8f092f, #760827);
        box-shadow: 0 12px 18px rgba(61, 22, 38, 0.2);
        content: "";
        transform: translateZ(-16px) translateY(4px);
      }

      .envelope::after {
        pointer-events: none;
      }

      .envelope::before {
        position: absolute;
        z-index: 1;
        top: -50px;
        left: 20%;
        width: 60%;
        height: 148px;
        border: 1px solid rgba(105, 4, 34, 0.28);
        background:
          linear-gradient(155deg, rgba(255, 116, 143, 0.3), transparent 55%),
          linear-gradient(145deg, #c41543, #8f082f 88%);
        clip-path: polygon(50% 0, 100% 42%, 100% 100%, 0 100%, 0 42%);
        filter: drop-shadow(0 5px 5px rgba(77, 4, 31, 0.25));
        content: "";
        pointer-events: none;
      }

      .photo {
        position: absolute;
        z-index: 3;
        display: flex;
        width: 40%;
        height: 205px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 8px 7px 20px;
        border: 5px solid #fffdf8;
        background: #bac8b7;
        box-shadow: 0 9px 17px rgba(66, 31, 46, 0.25);
        color: #765b66;
        font: 600 0.62rem/1.25 system-ui, sans-serif;
        transition: transform 250ms ease, box-shadow 250ms ease;
        transform-style: preserve-3d;
      }

      .photo svg,
      .photo img {
        width: 100%;
        height: 100%;
        min-height: 0;
        flex: 1;
        border-radius: 1px;
        object-fit: cover;
      }

      .photo-one {
        z-index: 4;
        top: 40%;
        left: 31%;
        width: 38%;
        transform: rotate(-1deg);
      }

      .photo-two {
        z-index: 3;
        top: 32%;
        left: 4%;
        right: auto;
        transform: rotate(-7deg);
      }

      .photo-three {
        z-index: 3;
        top: 32%;
        right: 4%;
        left: auto;
        transform: rotate(4deg);
      }

      .letter-card {
        position: absolute;
        z-index: 2;
        top: 5%;
        left: 50%;
        display: flex;
        width: min(380px, 78%);
        height: 250px;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 24px 22px 17px;
        border: 1px solid rgba(143, 111, 115, 0.2);
        background: #fffef9;
        box-shadow:
          0 11px 20px rgba(73, 38, 52, 0.13),
          inset 0 1px 0 #fff;
        color: inherit;
        cursor: pointer;
        text-decoration: none;
        transform: translateX(-50%) rotate(-1.5deg);
        transition: transform 220ms ease, box-shadow 220ms ease;
      }

      .letter-card:hover {
        box-shadow: 0 16px 24px rgba(73, 38, 52, 0.2);
        transform: translate(-50%, -5px) rotate(0);
      }

      .letter-card:focus-visible,
      .close-letter:focus-visible,
      .back-link:focus-visible {
        outline: 3px solid #9d3157;
        outline-offset: 4px;
      }

      .letter-card .to {
        margin: 4px 0 10px;
        color: #634458;
        font: italic clamp(2rem, 7vw, 2.65rem)/1.05 "Segoe Script", "Brush Script MT", cursive;
      }

      .letter-card .preview {
        max-width: 220px;
        margin: 0;
        color: #806f74;
        font: 0.96rem/1.4 Georgia, "Times New Roman", serif;
      }

      .letter-card .read-hint {
        display: none;
      }

      .pocket {
        position: absolute;
        z-index: 5;
        inset: 0;
        border-radius: 6px;
        background:
          linear-gradient(147deg, transparent 48.8%, rgba(93, 4, 31, 0.42) 49.6%, rgba(255, 191, 204, 0.2) 50.5%, transparent 51.5%) left / 50.1% 100% no-repeat,
          linear-gradient(213deg, transparent 48.8%, rgba(255, 191, 204, 0.19) 49.6%, rgba(93, 4, 31, 0.4) 50.5%, transparent 51.5%) right / 50.1% 100% no-repeat,
          linear-gradient(145deg, #ce1748, #ad0d3b 67%, #8f092f);
        clip-path: polygon(0 52%, 50% 83%, 100% 52%, 100% 100%, 0 100%);
        filter: drop-shadow(0 -2px 2px rgba(255, 204, 211, 0.3)) drop-shadow(0 7px 5px rgba(75, 3, 29, 0.18));
        pointer-events: none;
        transform: translateZ(12px);
      }

      .pocket::after {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), transparent 30%);
        clip-path: polygon(0 52%, 50% 83%, 100% 52%, 100% 100%, 0 100%);
        content: "";
      }

      .birthday-seal {
        position: absolute;
        z-index: 6;
        right: -88px;
        bottom: -16px;
        width: 190px;
        height: 235px;
        filter: drop-shadow(0 10px 7px rgba(53, 24, 37, 0.2));
        pointer-events: none;
        transform: translateY(10%);
      }

      .birthday-seal img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .candle-flame {
        position: absolute;
        z-index: 1;
        top: 12%;
        left: 45%;
        width: 10%;
        height: 10%;
        border-radius: 55% 45% 50% 50% / 70% 70% 30% 30%;
        background: radial-gradient(ellipse at 50% 72%, #fff8b2 0 12%, #ffc34f 36%, #ff783c 69%, rgba(255, 91, 54, 0) 100%);
        filter: drop-shadow(0 0 5px rgba(255, 153, 62, 0.72));
        transform-origin: 50% 90%;
        animation: candle-flicker 700ms ease-in-out infinite alternate;
      }

      .candle-flame::after {
        position: absolute;
        top: 27%;
        left: 35%;
        width: 30%;
        height: 53%;
        border-radius: 50% 50% 45% 45%;
        background: linear-gradient(180deg, #fffde0, #fff1a1 75%, rgba(255, 244, 180, 0));
        content: "";
      }

      @keyframes candle-flicker {
        0% {
          opacity: 0.88;
          transform: rotate(-5deg) scale(0.92, 0.96);
        }

        35% {
          transform: rotate(3deg) scale(1.05, 1.08);
        }

        70% {
          opacity: 1;
          transform: rotate(-2deg) scale(0.96, 1.04);
        }

        100% {
          opacity: 0.92;
          transform: rotate(5deg) scale(1.08, 0.94);
        }
      }

      .back-link {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        color: #8a5268;
        font: 600 0.82rem system-ui, sans-serif;
        text-decoration: none;
      }

      .back-link:hover {
        color: #a7143c;
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      .click-hint {
        margin: 0;
        color: #806d76;
        font: 600 0.9rem/1.45 system-ui, sans-serif;
        text-align: center;
        transform: translateY(4vh);
      }

      .back-link:focus-visible {
        position: static;
        width: auto;
        height: auto;
        margin-top: 10px;
        overflow: visible;
        clip-path: none;
        white-space: normal;
      }

      @media (max-width: 480px) {
        .page {
          justify-content: center;
          padding: 18px 15px 22px;
        }

        .envelope-scene {
          width: min(500px, 88vw);
          height: clamp(410px, 125vw, 500px);
        }

        .envelope {
          bottom: 12px;
          height: 77%;
        }

        .photo {
          height: 35%;
          border-width: 4px;
          font-size: 0.52rem;
        }

        .photo-one {
          top: 40%;
          left: 31%;
          width: 38%;
        }

        .photo-two {
          top: 32%;
          left: 3%;
          right: auto;
        }

        .photo-three {
          top: 32%;
          right: 3%;
          left: auto;
        }

        .letter-card {
          top: 5%;
          width: 78%;
          height: 43%;
          padding: 17px 14px 12px;
        }

        .letter-card .to {
          font-size: clamp(1.7rem, 8vw, 2.25rem);
        }

        .letter-card .preview {
          font-size: 0.82rem;
        }

        .birthday-seal {
          right: -22px;
          bottom: -11px;
          width: 135px;
          height: 170px;
          transform: translateY(10%);
        }
      }

      @media (max-width: 340px) {
        .birthday-seal {
          right: -14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .balloon-field {
          display: none;
        }

        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }

        .candle-flame {
          animation: none;
        }
      }
    </style>
    <link rel="stylesheet" href="assets/music-player.css">
    <script src="assets/music-player.js" defer></script>
  </head>
  <body>
    <audio id="birthday-music" src="assets/songjade.mp3" preload="auto" loop></audio>
    <button class="music-toggle" id="music-toggle" type="button" aria-controls="birthday-music" aria-pressed="false">Putar musik</button>
    <p class="music-status" id="music-status" role="status" aria-live="polite"></p>
    <main class="page">
      <div class="background-decor" aria-hidden="true">
        <span class="background-sparkle background-sparkle-one">✦</span>
        <span class="background-sparkle background-sparkle-two">♡</span>
        <span class="background-sparkle background-sparkle-three">✧</span>
        <span class="background-sparkle background-sparkle-four">♥</span>
        <span class="background-sparkle background-sparkle-five">✧</span>
        <span class="background-sparkle background-sparkle-six">✦</span>
      </div>
      <div class="balloon-field" aria-hidden="true">
        <span class="balloon balloon-one"></span>
        <span class="balloon balloon-two"></span>
        <span class="balloon balloon-three"></span>
        <span class="balloon balloon-four"></span>
        <span class="balloon balloon-five"></span>
      </div>
      <section class="envelope-scene" aria-label="An envelope with a letter and three memory photos">
        <div class="envelope">
          <div class="photo photo-one" role="img" aria-label="First memory photo">
            <img src="assets/foto-1.jpg" alt="First memory photo" />
          </div>
          <div class="photo photo-two" role="img" aria-label="Second memory photo">
            <img src="assets/zee2.jpg" alt="Second memory photo" />
          </div>
          <div class="photo photo-three" role="img" aria-label="Third memory photo">
            <img src="assets/zee3.jpg" alt="Third memory photo" />
          </div>


          <a class="letter-card" href="surat.html">
            <span class="to">Dear Jade,</span>
            <span class="preview">Happy Birthday! May your special day be filled with happiness and beautiful memories.</span>
            <span class="read-hint">Click the letter to read</span>
          </a>

          <div class="pocket" aria-hidden="true"></div>
        </div>
        <div class="birthday-seal" aria-hidden="true">
          <img src="assets/retro-pixel-birthday-cake-sticker.png" alt="">
          <span class="candle-flame"></span>
        </div>
      </section>

      <p class="click-hint">(click on the letter<br>to read it!)</p>

      <a class="back-link" href="index.html">← Back to home</a>
    </main>

  </body>
</html>
