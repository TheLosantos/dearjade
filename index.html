<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4e9ed">
    <title>You Got a Mail!</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f4e9ed;
        color: #432c38;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background-color: #fff;
        background:
          radial-gradient(ellipse at 50% 82%, rgba(187, 115, 139, 0.15), transparent 56%),
          radial-gradient(ellipse at 50% 34%, rgba(255, 255, 255, 0.78), transparent 54%);
        animation: background-arrives 1200ms 250ms ease-out forwards;
      }

      .scene {
        position: relative;
        isolation: isolate;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 44px 20px 56px;
        text-align: center;
      }

      .background-decor {
        position: absolute;
        z-index: -1;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .background-decor::before,
      .background-decor::after {
        position: absolute;
        inset: 0;
        content: "";
      }

      .background-decor::before {
        background:
          radial-gradient(ellipse at 10% 20%, rgba(255, 222, 167, 0.42), transparent 34%),
          radial-gradient(ellipse at 91% 27%, rgba(238, 174, 191, 0.3), transparent 33%),
          radial-gradient(ellipse at 82% 88%, rgba(255, 222, 167, 0.32), transparent 31%),
          radial-gradient(ellipse at 14% 83%, rgba(229, 185, 208, 0.24), transparent 34%);
      }

      .background-decor::after {
        background:
          radial-gradient(circle, rgba(195, 132, 77, 0.3) 1.4px, transparent 2px) 8% 24% / 143px 143px,
          radial-gradient(circle, rgba(197, 95, 117, 0.23) 1.2px, transparent 2px) 91% 20% / 157px 157px,
          radial-gradient(circle, rgba(195, 132, 77, 0.25) 1.3px, transparent 2px) 86% 83% / 151px 151px,
          radial-gradient(circle, rgba(197, 95, 117, 0.2) 1.2px, transparent 2px) 13% 78% / 169px 169px;
      }

      .background-sparkle {
        position: absolute;
        color: #c99439;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1;
        opacity: 0.7;
        text-shadow: 0 2px 6px rgba(180, 124, 54, 0.18);
        animation: sparkle-float 3.6s ease-in-out infinite;
      }

      .background-sparkle-one {
        top: 13%;
        left: 17%;
        font-size: 1.45rem;
      }

      .background-sparkle-two {
        top: 23%;
        right: 15%;
        color: #c45b70;
        font-size: 1.15rem;
        animation-delay: 600ms;
      }

      .background-sparkle-three {
        top: 48%;
        left: 8%;
        font-size: 1.1rem;
        animation-delay: 1.2s;
      }

      .background-sparkle-four {
        top: 55%;
        right: 9%;
        color: #c45b70;
        font-size: 1.55rem;
        animation-delay: 350ms;
      }

      .background-sparkle-five {
        bottom: 17%;
        left: 22%;
        color: #c45b70;
        font-size: 1.05rem;
        animation-delay: 900ms;
      }

      .background-sparkle-six {
        right: 24%;
        bottom: 13%;
        font-size: 1.35rem;
        animation-delay: 1.5s;
      }

      .balloon-field {
        position: absolute;
        z-index: -1;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .balloon {
        position: absolute;
        bottom: -110px;
        left: var(--balloon-left);
        width: var(--balloon-width, 42px);
        height: calc(var(--balloon-width, 42px) * 1.22);
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 50% 50% 46% 46%;
        background: radial-gradient(ellipse at 32% 25%, #fff4d4 0%, var(--balloon-light) 13%, var(--balloon-color) 58%, var(--balloon-dark) 100%);
        box-shadow: inset -5px -5px 9px rgba(95, 42, 48, 0.12), 0 4px 10px rgba(108, 67, 69, 0.12);
        opacity: 0;
        animation: balloon-rise var(--balloon-duration, 21s) var(--balloon-delay, 0s) linear infinite;
      }

      .balloon::before {
        position: absolute;
        bottom: -6px;
        left: calc(50% - 4px);
        width: 8px;
        height: 8px;
        background: var(--balloon-dark);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        content: "";
      }

      .balloon::after {
        position: absolute;
        top: calc(100% + 2px);
        left: 50%;
        width: 1px;
        height: 78px;
        background: rgba(111, 89, 91, 0.45);
        content: "";
        transform: rotate(3deg);
        transform-origin: top;
      }

      .balloon-one {
        --balloon-left: 8%;
        --balloon-width: 38px;
        --balloon-light: #ffe0a1;
        --balloon-color: #f2bd54;
        --balloon-dark: #ce8b2a;
        --balloon-duration: 22s;
        --balloon-delay: -8s;
      }

      .balloon-two {
        --balloon-left: 25%;
        --balloon-width: 30px;
        --balloon-light: #ffd9e1;
        --balloon-color: #ec91a8;
        --balloon-dark: #c85d78;
        --balloon-duration: 19s;
        --balloon-delay: -15s;
      }

      .balloon-three {
        --balloon-left: 43%;
        --balloon-width: 34px;
        --balloon-light: #fff0b8;
        --balloon-color: #e7c85d;
        --balloon-dark: #c09b37;
        --balloon-duration: 24s;
        --balloon-delay: -4s;
      }

      .balloon-four {
        --balloon-left: 63%;
        --balloon-width: 31px;
        --balloon-light: #f9d4dd;
        --balloon-color: #df849d;
        --balloon-dark: #b84c69;
        --balloon-duration: 20s;
        --balloon-delay: -12s;
      }

      .balloon-five {
        --balloon-left: 83%;
        --balloon-width: 40px;
        --balloon-light: #ffe8bb;
        --balloon-color: #eab270;
        --balloon-dark: #c57e48;
        --balloon-duration: 23s;
        --balloon-delay: -18s;
      }

      @keyframes balloon-rise {
        0% {
          opacity: 0;
          transform: translate3d(0, 0, 0) rotate(-5deg);
        }

        8% {
          opacity: 0.82;
        }

        50% {
          transform: translate3d(14px, -62vh, 0) rotate(5deg);
        }

        92% {
          opacity: 0.78;
        }

        100% {
          opacity: 0;
          transform: translate3d(-8px, -125vh, 0) rotate(-4deg);
        }
      }

      h1 {
        margin: 0 0 28px;
        color: #543b4c;
        font-size: clamp(1.55rem, 4vw, 2.25rem);
        font-weight: 400;
        letter-spacing: 0.09em;
        animation: fade-in 500ms 350ms ease-out both;
      }

      .mailbox {
        position: relative;
        z-index: 0;
        width: min(440px, 82vw);
        height: 84px;
        border: 2px solid #c5d2cc;
        border-radius: 15px;
        background: linear-gradient(180deg, #f9fffb 0%, #e4eee8 22%, #cbd9d1 75%, #b7c8be 100%);
        box-shadow:
          inset 0 2px 2px rgba(255, 255, 255, 0.98),
          inset 0 8px 12px rgba(255, 255, 255, 0.48),
          inset 0 -8px 11px rgba(77, 100, 88, 0.16),
          0 8px 16px rgba(81, 61, 72, 0.13),
          0 2px 3px rgba(81, 61, 72, 0.08);
        animation: slot-pops-in 600ms 350ms cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }

      .mailbox::before {
        position: absolute;
        top: 32px;
        right: 9%;
        left: 9%;
        height: 8px;
        border-radius: 99px;
        background: linear-gradient(180deg, #56645d, #3d4843 42%, #87948c);
        box-shadow:
          0 1px 1px rgba(255, 255, 255, 0.85),
          inset 0 1px 2px rgba(28, 40, 33, 0.8);
        content: "";
      }

      .mailbox::after {
        position: absolute;
        top: 15px;
        right: 8%;
        left: 8%;
        height: 2px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.75);
        content: "";
      }

      .envelope-wrap {
        position: relative;
        z-index: 1;
        width: min(336px, 68vw);
        height: 250px;
        margin-top: -28px;
        perspective: 1000px;
        transform-style: preserve-3d;
      }

      .sparkle {
        position: absolute;
        z-index: 2;
        color: #d9a832;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(159, 105, 26, 0.2);
        animation: sparkle-float 2.8s ease-in-out infinite;
      }

      .sparkle-one {
        top: 9%;
        left: -11%;
        font-size: 1.55rem;
      }

      .sparkle-two {
        top: 20%;
        right: -10%;
        color: #c94054;
        font-size: 1.2rem;
        animation-delay: 450ms;
      }

      .sparkle-three {
        right: -15%;
        bottom: 18%;
        font-size: 1.7rem;
        animation-delay: 900ms;
      }

      .sparkle-four {
        bottom: 11%;
        left: -13%;
        color: #c94054;
        font-size: 1.25rem;
        animation-delay: 1.3s;
      }

      .sparkle-five {
        top: 3%;
        right: 14%;
        color: #e4bd53;
        font-size: 0.85rem;
        animation-delay: 700ms;
      }

      @keyframes sparkle-float {
        0%,
        100% {
          opacity: 0.55;
          transform: translateY(0) rotate(-8deg) scale(0.9);
        }

        50% {
          opacity: 1;
          transform: translateY(-7px) rotate(10deg) scale(1.12);
        }
      }

      .envelope-wrap::after {
        position: absolute;
        z-index: -1;
        right: 5%;
        bottom: -12px;
        left: 5%;
        height: 23px;
        border-radius: 50%;
        background: rgba(74, 38, 55, 0.25);
        content: "";
        filter: blur(13px);
        transform: translateZ(-20px);
      }

      .envelope {
        position: absolute;
        inset: 0;
        overflow: visible;
        border: 1px solid rgba(139, 91, 16, 0.42);
        border-radius: 8px;
        background: linear-gradient(145deg, #ffe99a 0%, #f4c84f 42%, #d99b20 100%);
        box-shadow:
          inset 1px 1px 0 rgba(255, 255, 225, 0.7),
          inset -2px -3px 6px rgba(126, 81, 11, 0.18),
          0 16px 24px rgba(91, 34, 57, 0.2),
          0 4px 7px rgba(91, 34, 57, 0.13);
        transform-style: preserve-3d;
        animation: envelope-emerges 1100ms 650ms cubic-bezier(0.18, 0.8, 0.25, 1.15) both;
      }

      .envelope-back {
        position: absolute;
        inset: 0;
        border-radius: 7px;
        background: linear-gradient(145deg, #ffedaa 0%, #f2c84c 40%, #d99b20 100%);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 225, 0.22);
      }

      .flap {
        position: absolute;
        z-index: 3;
        inset: 0 0 auto;
        height: 64%;
        background: linear-gradient(145deg, #fff2bd 0%, #f5d76e 54%, #e1ad31 100%);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        transform-origin: top center;
        backface-visibility: hidden;
        filter: drop-shadow(0 2px 3px rgba(110, 76, 17, 0.2));
        transition: transform 700ms cubic-bezier(0.2, 0.75, 0.25, 1), z-index 0ms 350ms;
      }

      .envelope-front {
        position: absolute;
        z-index: 2;
        inset: 0;
        background:
          linear-gradient(145deg, transparent 49.2%, rgba(135, 89, 16, 0.25) 50%, rgba(255, 248, 207, 0.3) 50.7%, transparent 51.5%) left / 50.1% 100% no-repeat,
          linear-gradient(215deg, transparent 49.2%, rgba(255, 248, 207, 0.28) 50%, rgba(135, 89, 16, 0.24) 50.8%, transparent 51.5%) right / 50.1% 100% no-repeat,
          linear-gradient(180deg, #f2c84c, #dda324);
        clip-path: polygon(0 45%, 50% 82%, 100% 45%, 100% 100%, 0 100%);
        filter: drop-shadow(0 -1px 1px rgba(255, 250, 210, 0.34));
      }

      .seal {
        position: absolute;
        z-index: 4;
        top: 43%;
        left: 50%;
        display: grid;
        width: 58px;
        aspect-ratio: 1;
        place-items: center;
        border: 3px solid #fff0a4;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 25%, #f05a5a 0%, #d92f3a 42%, #b5122c 82%, #8f0a20 100%);
        box-shadow:
          0 4px 8px rgba(65, 20, 34, 0.34),
          0 1px 1px rgba(255, 255, 255, 0.85),
          inset 0 0 0 3px rgba(112, 9, 29, 0.3),
          inset 0 2px 3px rgba(255, 225, 225, 0.55);
        color: #ffeb70;
        font-size: 1.45rem;
        transform: translate(-50%, -50%);
        transition: opacity 250ms ease, transform 250ms ease;
      }

      .button {
        position: relative;
        z-index: 5;
        display: inline-block;
        min-width: 126px;
        margin-top: 30px;
        padding: 13px 24px;
        border: 0;
        border-radius: 999px;
        background: #b20e42;
        box-shadow: 0 5px 12px rgba(118, 30, 60, 0.17);
        color: #fff;
        cursor: pointer;
        font: 600 0.86rem system-ui, sans-serif;
        text-decoration: none;
        transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
        animation: button-appears 500ms 1450ms ease-out both;
      }

      .button:hover {
        background: #961037;
        box-shadow: 0 7px 16px rgba(118, 30, 60, 0.22);
        transform: translateY(-2px);
      }

      .button:focus-visible {
        outline: 3px solid #58384a;
        outline-offset: 4px;
      }

      @keyframes background-arrives {
        to {
          background-color: #f5e9ee;
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes button-appears {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes slot-pops-in {
        from {
          opacity: 0;
          transform: perspective(700px) rotateX(-20deg) translateY(-12px) scaleX(0.72) scaleY(0.8);
        }

        to {
          opacity: 1;
          transform: perspective(700px) rotateX(0) translateY(0) scale(1);
        }
      }

      @keyframes envelope-emerges {
        from {
          opacity: 0;
          transform: translateY(-155px) translateZ(-70px) rotateX(-18deg) rotateY(-5deg) scale(0.82);
        }

        72% {
          opacity: 1;
          transform: translateY(10px) translateZ(18px) rotateX(3deg) rotateY(1deg) scale(1.015);
        }

        to {
          opacity: 1;
          transform: translateY(0) translateZ(0) rotateX(2deg) rotateY(-2deg) scale(1);
        }
      }

      .confetti {
        position: fixed;
        z-index: 10;
        top: -18px;
        width: 9px;
        height: 13px;
        pointer-events: none;
        animation: fall var(--duration) linear forwards;
      }

      @keyframes fall {
        to {
          transform: translate3d(var(--drift), 110vh, 0) rotate(760deg);
          opacity: 0;
        }
      }

      @media (max-width: 480px) {
        .scene {
          padding-top: 28px;
          padding-bottom: 36px;
        }

        .mailbox {
          height: 70px;
        }

        .mailbox::before {
          top: 26px;
        }

        .envelope-wrap {
          height: 228px;
          margin-top: -22px;
        }

      }

      @media (prefers-reduced-motion: reduce) {
        body {
          background-color: #f4e9ed;
        }

        .balloon-field {
          display: none;
        }

        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene" id="scene">
      <div class="background-decor" aria-hidden="true">
        <span class="background-sparkle background-sparkle-one">✦</span>
        <span class="background-sparkle background-sparkle-two">♡</span>
        <span class="background-sparkle background-sparkle-three">✧</span>
        <span class="background-sparkle background-sparkle-four">♥</span>
        <span class="background-sparkle background-sparkle-five">✧</span>
        <span class="background-sparkle background-sparkle-six">✦</span>
      </div>
      <div class="balloon-field" aria-hidden="true">
        <span class="balloon balloon-one"></span>
        <span class="balloon balloon-two"></span>
        <span class="balloon balloon-three"></span>
        <span class="balloon balloon-four"></span>
        <span class="balloon balloon-five"></span>
      </div>
      <h1>YOU GOT A MAIL!</h1>
      <div class="mailbox" aria-hidden="true"></div>
      <div class="envelope-wrap" aria-label="Birthday greeting envelope">
        <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
        <span class="sparkle sparkle-two" aria-hidden="true">♡</span>
        <span class="sparkle sparkle-three" aria-hidden="true">✧</span>
        <span class="sparkle sparkle-four" aria-hidden="true">♥</span>
        <span class="sparkle sparkle-five" aria-hidden="true">·</span>
        <div class="envelope">
          <div class="envelope-back"></div>
          <div class="flap"></div>
          <div class="envelope-front"></div>
          <div class="seal" aria-hidden="true">♡</div>
        </div>
      </div>
      <a class="button" href="kenangan.html">
        Click here
      </a>
    </main>
  </body>
</html>
